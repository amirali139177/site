<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مدیریت کارها | Todo مدرن</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f13;
      --bg-card: rgba(255, 255, 255, 0.05);
      --bg-card-hover: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f0f0f5;
      --text-muted: #a0a0b0;
      --primary: #7c5cfc;
      --primary-hover: #6a4aef;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Vazirmatn', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image: 
        radial-gradient(ellipse at 20% 20%, rgba(124, 92, 252, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(34, 197, 94, 0.08) 0%, transparent 50%);
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      padding-top: 12px;
    }

    header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #7c5cfc, #22c55e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Progress */
    .progress-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .progress-bar {
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c5cfc, #22c55e);
      border-radius: 999px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      width: 0%;
    }

    /* Input Form */
    .input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .input-section input,
    .input-section select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    .input-section input {
      flex: 1;
      min-width: 180px;
    }

    .input-section input:focus,
    .input-section select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(124, 92, 252, 0.25);
    }

    .input-section select {
      cursor: pointer;
      min-width: 110px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 14px 22px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    /* Filters */
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    /* Task List */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.25s ease;
      backdrop-filter: blur(8px);
      animation: slideIn 0.35s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .task-item:hover {
      background: var(--bg-card-hover);
      border-color: rgba(124, 92, 252, 0.3);
    }

    .task-item.completed {
      opacity: 0.65;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid var(--text-muted);
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .task-item.completed .checkbox {
      background: var(--success);
      border-color: var(--success);
    }

    .checkbox svg {
      width: 14px;
      height: 14px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .task-item.completed .checkbox svg {
      opacity: 1;
    }

    .task-content {
      flex: 1;
      min-width: 0;
    }

    .task-text {
      font-size: 1rem;
      font-weight: 500;
      word-break: break-word;
    }

    .task-meta {
      display: flex;
      gap: 10px;
      margin-top: 4px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .priority {
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .priority.low {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }

    .priority.medium {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
    }

    .priority.high {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      padding-bottom: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Responsive */
    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      header h1 {
        font-size: 1.6rem;
      }

      .input-section {
        flex-direction: column;
      }

      .input-section input,
      .input-section select,
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>مدیریت کارها</h1>
      <p>کارهای امروزت رو منظم کن و پیشرفتت رو ببین</p>
    </header>

    <div class="progress-section">
      <div class="progress-header">
        <span>پیشرفت امروز</span>
        <span id="progress-text">۰ از ۰</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <div class="input-section">
      <input type="text" id="task-input" placeholder="کار جدید رو بنویس..." maxlength="120" />
      <select id="priority-select">
        <option value="low">کم</option>
        <option value="medium" selected>متوسط</option>
        <option value="high">بالا</option>
      </select>
      <button class="btn btn-primary" id="add-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        اضافه
      </button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">همه</button>
      <button class="filter-btn" data-filter="active">فعال</button>
      <button class="filter-btn" data-filter="completed">انجام‌شده</button>
    </div>

    <div class="task-list" id="task-list">
      <!-- tasks will be rendered here -->
    </div>

    <footer>
      ساخته‌شده با ❤️ • داده‌ها فقط روی دستگاه شما ذخیره می‌شوند
    </footer>
  </div>

  <script>
    const taskInput = document.getElementById('task-input');
    const prioritySelect = document.getElementById('priority-select');
    const addBtn = document.getElementById('add-btn');
    const taskList = document.getElementById('task-list');
    const progressFill = document.getElementById('progress-fill');
    const progressText = document.getElementById('progress-text');
    const filterBtns = document.querySelectorAll('.filter-btn');

    let tasks = JSON.parse(localStorage.getItem('modern-todo-tasks')) || [];
    let currentFilter = 'all';

    function saveTasks() {
      localStorage.setItem('modern-todo-tasks', JSON.stringify(tasks));
    }

    function updateProgress() {
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
      
      progressFill.style.width = percent + '%';
      progressText.textContent = `${completed} از ${total}`;
    }

    function getPriorityLabel(priority) {
      const map = { low: 'کم', medium: 'متوسط', high: 'بالا' };
      return map[priority] || priority;
    }

    function renderTasks() {
      let filtered = tasks;
      if (currentFilter === 'active') {
        filtered = tasks.filter(t => !t.completed);
      } else if (currentFilter === 'completed') {
        filtered = tasks.filter(t => t.completed);
      }

      if (filtered.length === 0) {
        taskList.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M9 11l3 3L22 4"></path>
              <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path>
            </svg>
            <p>${currentFilter === 'completed' ? 'هنوز کاری انجام نداده‌ای' : 'هیچ کاری وجود ندارد. یکی اضافه کن!'}</p>
          </div>
        `;
        updateProgress();
        return;
      }

      taskList.innerHTML = filtered.map(task => `
        <div class="task-item ${task.completed ? 'completed' : ''}" data-id="${task.id}">
          <div class="checkbox" onclick="toggleTask('${task.id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <div class="task-content">
            <div class="task-text">${escapeHtml(task.text)}</div>
            <div class="task-meta">
              <span class="priority ${task.priority}">${getPriorityLabel(task.priority)}</span>
            </div>
          </div>
          <button class="delete-btn" onclick="deleteTask('${task.id}')" title="حذف">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path>
            </svg>
          </button>
        </div>
      `).join('');

      updateProgress();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) {
        taskInput.focus();
        return;
      }

      const newTask = {
        id: Date.now().toString(),
        text,
        priority: prioritySelect.value,
        completed: false,
        createdAt: new Date().toISOString()
      };

      tasks.unshift(newTask);
      saveTasks();
      taskInput.value = '';
      taskInput.focus();
      renderTasks();
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        saveTasks();
        renderTasks();
      }
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderTasks();
    }

    // Event listeners
    addBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderTasks();
      });
    });

    // Initial render
    renderTasks();
  </script>
</body>
</html>
